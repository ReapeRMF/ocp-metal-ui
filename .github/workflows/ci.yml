name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ocp_metal_ui
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ocp_metal_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocp_metal_ui -d ocp_metal_ui"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: JavaScript dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            "cryptography==50.0.0" \
            "psycopg[binary]==3.3.8" \
            "PyYAML==6.0.2" \
            "ansible-core==2.18.8"

      - name: Backend tests
        env:
          DATABASE_URL: postgresql://ocp_metal_ui:ci-password@127.0.0.1:5432/ocp_metal_ui?sslmode=disable
        run: npm run test:backend

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck airgap-*.sh

      - name: hadolint
        run: |
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          chmod +x /tmp/hadolint
          /tmp/hadolint Containerfile.airgap

      - name: gitleaks
        # Scan the tree that will be merged. A full-history scan stays red
        # until pull-secret.vault is removed from older commits.
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git --redact --verbose
