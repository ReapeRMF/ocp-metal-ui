name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        # postgres:16 manifest list, 2026-11-19
        image: postgres@sha256:3950ad7c3148ca2175ef1b6c36c9efbf78957ae8fbe8b3a5d7c35af50500382f
        env:
          POSTGRES_USER: ocp_metal_ui
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: ocp_metal_ui
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ocp_metal_ui -d ocp_metal_ui"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: gitleaks
        # Scan the tree that will be merged, before npm ci creates node_modules.
        # A full-history scan stays red until pull-secret.vault is removed from
        # older commits.
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz
          echo "fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source . --no-git --redact --verbose

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: JavaScript dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Python test dependencies
        run: |
          python3 -m pip install --disable-pip-version-check \
            "cryptography==50.0.0" \
            "psycopg[binary]==3.3.8" \
            "PyYAML==6.0.2" \
            "ansible-core==2.18.8"

      - name: Backend tests
        env:
          DATABASE_URL: postgresql://ocp_metal_ui:ci-password@127.0.0.1:5432/ocp_metal_ui?sslmode=disable
        run: npm run test:backend

      - name: shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck airgap-*.sh tests/*.sh
          bash tests/test_vault_cleanup.sh

      - name: hadolint
        run: |
          curl -fsSL -o /tmp/hadolint \
            https://github.com/hadolint/hadolint/releases/download/v2.12.0/hadolint-Linux-x86_64
          echo "56de6d5e5ec427e17b74fa48d51271c7fc0d61244bf5c90e828aab8362d55010  /tmp/hadolint" | sha256sum -c -
          chmod +x /tmp/hadolint
          /tmp/hadolint Containerfile.airgap
